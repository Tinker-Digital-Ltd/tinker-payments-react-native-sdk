name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/checkout@v4
        with:
          repository: Tinker-Digital-Ltd/tinker-payments-web-sdk
          path: web-sdk
      - run: npm install && npm run build
        working-directory: web-sdk
      - run: npm install --no-save ./web-sdk
      - run: npm run lint
      - run: npm test
